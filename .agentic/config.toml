# Agentic configuration
# See: https://github.com/tnezdev/agentic

adapter = "filesystem"

[memory]
dir = ".agentic/memory"
default_tier = "L1"
dream_depth = "3"

[workflow]
graphs_dir = ".agentic/workflows"
runs_dir = ".agentic/runs"

[runtime]
default = "local"

[runtime.local]
package = "@tnezdev/agentic-runtime-local"

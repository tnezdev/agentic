id: data-boundary
kind: policy_declaration
description: Public example data boundary for this repo.
allowed_data_classes:
  - synthetic_regulated_demo
disallowed:
  - real_phi
  - real_patient_data
  - private_customer_data
rules:
  - Fixtures must remain synthetic and public-safe.
  - Runtime artifacts generated by this example inherit the fixture data_class.
  - No prompt, skill, or runner may claim access to real clinical systems.
